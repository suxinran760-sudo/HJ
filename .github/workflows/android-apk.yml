name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project if uploaded as zip
        shell: bash
        run: |
          for z in ./*.zip; do
            [ -e "$z" ] || continue
            echo "Unzipping $z"
            if command -v unzip >/dev/null 2>&1; then
              unzip -q -o "$z" -d ./_project
            else
              mkdir -p _project && (cd _project && jar xf "../$z")
            fi
          done

      - name: Locate project
        shell: bash
        run: |
          PROJECT_FILE="$(find . -name project.godot -not -path '*/.git/*' -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Prepare debug keystore
        shell: bash
        run: |
          KS=/root/debug.keystore
          if [ ! -f "$KS" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore "$KS" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Link Godot export templates
        shell: bash
        run: |
          ls /root/.local/share/godot/export_templates/ || true
          mkdir -p "$HOME/.local/share/godot"
          rm -rf "$HOME/.local/share/godot/export_templates"
          ln -s /root/.local/share/godot/export_templates "$HOME/.local/share/godot/export_templates"
          ls -la "$HOME/.local/share/godot/export_templates/"*/ | head -n 20

      - name: Import project
        run: godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Install Android build tools 35 and configure Godot
        shell: bash
        run: |
          OLD="$(find / -type d -path '*/build-tools/33.0.2' -not -path '/proc/*' 2>/dev/null | head -n1)"
          if [ -n "$OLD" ]; then
            SDK="$(dirname "$(dirname "$OLD")")"
          else
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          fi
          echo "SDK=$SDK"
          SM="$(find "$SDK" /opt /usr -name sdkmanager -type f 2>/dev/null | head -n1)"
          echo "sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "build-tools;35.0.1" "platforms;android-35" "platform-tools"
          test -d "$SDK/build-tools/35.0.1" || { echo "build-tools 35.0.1 missing"; exit 1; }
          JH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")}"
          echo "JAVA=$JH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          F="$HOME/.config/godot/editor_settings-4.4.tres"
          if [ ! -f "$F" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$F"
          fi
          for kv in "export/android/android_sdk_path|$SDK" "export/android/java_sdk_path|$JH" "export/android/debug_keystore|/root/debug.keystore" "export/android/debug_keystore_user|androiddebugkey" "export/android/debug_keystore_pass|android"; do
            k="${kv%%|*}"; v="${kv#*|}"
            if grep -q "^$k" "$F"; then
              sed -i "s|^$k.*|$k = \"$v\"|" "$F"
            else
              echo "$k = \"$v\"" >> "$F"
            fi
          done
          echo "HOME=$HOME settings file: $F"
          cat "$F"

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/build"
          set +e
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/Hajimi-Warfare.apk" 2>&1 | tee export.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            echo "=========== INFO (screenshot this) ==========="
            echo "ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME HOME=$HOME"
            echo "build-tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
            echo "cmdline-tools: $(ls "$ANDROID_HOME/cmdline-tools" 2>&1 | tr '\n' ' ')"
            echo "platform-tools: $(ls "$ANDROID_HOME/platform-tools" 2>&1 | head -n3 | tr '\n' ' ')"
            echo "=========== CONFIG ERRORS ==========="
            sed -n '/configuration errors/,/Project export for preset/p' export.log | head -n 15
            exit "$CODE"
          fi

      - name: Verify APK
        run: |
          test -s "$PROJECT_DIR/build/Hajimi-Warfare.apk"
          ls -lh "$PROJECT_DIR/build/Hajimi-Warfare.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hajimi-Warfare-APK
          path: ${{ env.PROJECT_DIR }}/build/Hajimi-Warfare.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Releases (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 哈基米枪战 build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/build/Hajimi-Warfare.apk
