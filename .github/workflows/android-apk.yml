name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project if uploaded as zip
        shell: bash
        run: |
          for z in ./*.zip; do
            [ -e "$z" ] || continue
            echo "Unzipping $z"
            if command -v unzip >/dev/null 2>&1; then
              unzip -q -o "$z" -d ./_project
            else
              mkdir -p _project && (cd _project && jar xf "../$z")
            fi
          done

      - name: Locate project
        shell: bash
        run: |
          PROJECT_FILE="$(find . -name project.godot -not -path '*/.git/*' -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Prepare debug keystore
        shell: bash
        run: |
          KS=/root/debug.keystore
          if [ ! -f "$KS" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore "$KS" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project
        run: godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Install Android build tools 35 into Godot SDK
        shell: bash
        run: |
          OLD="$(find / -type d -path '*/build-tools/33.0.2' -not -path '/proc/*' 2>/dev/null | head -n1)"
          if [ -n "$OLD" ]; then
            SDK="$(dirname "$(dirname "$OLD")")"
          else
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          fi
          echo "SDK=$SDK"
          SM="$(find "$SDK" /opt /usr -name sdkmanager -type f 2>/dev/null | head -n1)"
          echo "sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "build-tools;35.0.1" "platforms;android-35" "platform-tools"
          echo "build-tools now:"; ls "$SDK/build-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          for f in /root/.config/godot/editor_settings-*.tres; do
            [ -e "$f" ] || continue
            if grep -q '^export/android/android_sdk_path' "$f"; then
              sed -i "s|^export/android/android_sdk_path.*|export/android/android_sdk_path = \"$SDK\"|" "$f"
            else
              echo "export/android/android_sdk_path = \"$SDK\"" >> "$f"
            fi
            echo "patched $f"
          done

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/build"
          set +e
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/Hajimi-Warfare.apk" 2>&1 | tee export.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            echo "=========== KEY ERRORS (screenshot this) ==========="
            grep -n -i -E "error|fail|could not|cannot|missing|invalid|not found|unable" export.log | grep -v "5037" | tail -25
            exit "$CODE"
          fi

      - name: Verify APK
        run: |
          test -s "$PROJECT_DIR/build/Hajimi-Warfare.apk"
          ls -lh "$PROJECT_DIR/build/Hajimi-Warfare.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hajimi-Warfare-APK
          path: ${{ env.PROJECT_DIR }}/build/Hajimi-Warfare.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Releases (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 哈基米枪战 build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/build/Hajimi-Warfare.apk
